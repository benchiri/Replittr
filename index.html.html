<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RewardHub - Earn Rewards Through Skills & Referrals</title>
    <meta name="description" content="Complete skill-based tasks, refer friends, and earn real rewards with RewardHub" />
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c10;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        #root {
            min-height: 100vh;
        }

        /* Modern CSS Reset and Base Styles */
        .rewardhub-app {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0c10 0%, #0f1117 100%);
            color: #ffffff;
        }

        /* Landing Page Styles */
        .landing-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(10,12,16,0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(16,185,129,0.3);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .gradient-text {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 18px;
            color: #a1a5b5;
            margin-bottom: 40px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            padding: 60px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .feature-card {
            background: rgba(26,29,38,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            transition: all 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: rgba(16,185,129,0.3);
        }

        .feature-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .feature-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .feature-card p {
            color: #a1a5b5;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Dashboard Styles */
        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 100px;
        }

        .welcome-section {
            margin-bottom: 32px;
        }

        .welcome-section h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-box {
            background: rgba(26,29,38,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-2px);
            border-color: rgba(16,185,129,0.3);
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            color: #6b6f7e;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
        }

        .stat-value.green { color: #10b981; }
        .stat-value.cyan { color: #06b6d4; }
        .stat-value.purple { color: #8b5cf6; }
        .stat-value.amber { color: #f59e0b; }

        .action-cards {
            display: grid;
            gap: 16px;
            margin-bottom: 32px;
        }

        .action-card {
            background: rgba(26,29,38,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-card:hover {
            transform: translateX(5px);
            border-color: #10b981;
        }

        .action-icon {
            font-size: 32px;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }

        .action-content {
            flex: 1;
        }

        .action-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .action-desc {
            font-size: 12px;
            color: #6b6f7e;
        }

        /* Auth Pages */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: rgba(26,29,38,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
        }

        .auth-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        .auth-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-sub {
            text-align: center;
            color: #6b6f7e;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #6b6f7e;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: #10b981;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26,29,38,0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            padding: 8px 16px 20px;
            gap: 8px;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            background: none;
            border: none;
            color: #6b6f7e;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: #10b981;
            background: rgba(16,185,129,0.1);
        }

        .nav-icon {
            font-size: 22px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
        }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .alert-error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #ef4444;
        }

        /* Package Cards */
        .package-card {
            background: rgba(26,29,38,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            position: relative;
            transition: all 0.3s;
        }

        .package-card.popular {
            border-color: #8b5cf6;
            box-shadow: 0 0 20px rgba(139,92,246,0.2);
        }

        .popular-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #8b5cf6;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .package-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .package-price {
            font-size: 32px;
            font-weight: 800;
            color: #06b6d4;
            margin-bottom: 16px;
        }

        .package-coins {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }

        /* Task Filters */
        .task-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: #a1a5b5;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }

        /* Referral Code Box */
        .referral-box {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .referral-code {
            font-family: monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .hero h1 { font-size: 36px; }
            .landing-header { padding: 16px 20px; }
            .features { padding: 40px 20px; }
            .auth-card { padding: 32px 24px; }
            .stat-value { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useCallback } = React;

        // Storage helpers
        const storage = {
            get: (key) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : null;
                } catch { return null; }
            },
            set: (key, value) => localStorage.setItem(key, JSON.stringify(value)),
            remove: (key) => localStorage.removeItem(key),
        };

        const generateId = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        const generateReferralCode = (username) => `${username.slice(0, 4)}${Math.random().toString(36).slice(2, 8).toUpperCase()}`;

        // Packages
        const PACKAGES = [
            { id: "small", name: "Starter", ksh: 300, coins: 30 },
            { id: "medium", name: "Growth", ksh: 500, coins: 70 },
            { id: "premium", name: "Premium", ksh: 1000, coins: 150, popular: true },
        ];

        // Mock Tasks
        const INITIAL_TASKS = [
            { id: "t1", title: "Follow on TikTok", description: "Follow our official TikTok account", category: "social", reward: 50, coin_cost: 5, difficulty: "Easy", is_active: true },
            { id: "t2", title: "Write a Review", description: "Write a 100-word review about your experience", category: "writing", reward: 150, coin_cost: 15, difficulty: "Medium", is_active: true },
            { id: "t3", title: "YouTube Watch", description: "Watch our latest video for 2 minutes", category: "social", reward: 40, coin_cost: 4, difficulty: "Easy", is_active: true },
            { id: "t4", title: "Vocabulary Builder", description: "Learn new words and use them in sentences", category: "learning", reward: 80, coin_cost: 8, difficulty: "Medium", is_active: true },
            { id: "t5", title: "Listening Task", description: "Listen to audio and answer questions", category: "listening", reward: 60, coin_cost: 6, difficulty: "Easy", is_active: true },
        ];

        // Auth Context
        const AuthContext = createContext(null);
        
        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const stored = storage.get("rh_user");
                setUser(stored);
                setLoading(false);
            }, []);

            const signup = async (email, password, username, referralCode) => {
                const allUsers = storage.get("rh_all_users") || [];
                if (allUsers.find(u => u.email === email)) throw new Error("Email already registered");
                if (allUsers.find(u => u.username === username)) throw new Error("Username taken");
                
                let referrerId = null;
                if (referralCode) {
                    const referrer = allUsers.find(u => u.referral_code === referralCode);
                    if (!referrer) throw new Error("Invalid referral code");
                    referrerId = referrer.id;
                }
                
                const isFirst = allUsers.length === 0;
                const newUser = {
                    id: generateId(),
                    email, username, password,
                    referral_code: generateReferralCode(username),
                    referred_by: referrerId,
                    total_earned: 0,
                    available_balance: 0,
                    pending_balance: 0,
                    coins_balance: 0,
                    total_referrals: 0,
                    is_admin: isFirst,
                    is_superadmin: isFirst,
                    has_purchased_package: false,
                    is_banned: false,
                    created_at: new Date().toISOString(),
                };
                
                storage.set("rh_all_users", [...allUsers, newUser]);
                
                if (referrerId) {
                    const newReferral = {
                        id: generateId(),
                        referrer_id: referrerId,
                        referee_id: newUser.id,
                        status: "pending",
                        reward_earned: 0,
                        coins_earned: 0,
                        created_at: new Date().toISOString(),
                    };
                    const referrals = storage.get("rh_referrals") || [];
                    storage.set("rh_referrals", [...referrals, newReferral]);
                }
                
                storage.set("rh_user", newUser);
                setUser(newUser);
            };
            
            const login = async (email, password) => {
                const allUsers = storage.get("rh_all_users") || [];
                const found = allUsers.find(u => u.email === email && u.password === password);
                if (!found) throw new Error("Invalid email or password");
                if (found.is_banned) throw new Error("Account is banned");
                storage.set("rh_user", found);
                setUser(found);
            };
            
            const logout = () => {
                storage.remove("rh_user");
                setUser(null);
            };
            
            return (
                <AuthContext.Provider value={{ user, loading, signup, login, logout }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        const useAuth = () => useContext(AuthContext);

        // Toast Context
        const ToastContext = createContext(null);
        
        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            
            const addToast = useCallback((toast) => {
                const id = generateId();
                setToasts(prev => [...prev, { ...toast, id }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
            }, []);
            
            return (
                <ToastContext.Provider value={addToast}>
                    {children}
                    <div className="toast-container">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`toast toast-${toast.type}`}>
                                <div>
                                    <div style={{ fontWeight: 600 }}>{toast.title}</div>
                                    {toast.message && <div style={{ fontSize: 12 }}>{toast.message}</div>}
                                </div>
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };
        
        const useToast = () => useContext(ToastContext);

        // Global State Context
        const GlobalContext = createContext(null);
        
        const GlobalProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [tasks] = useState(INITIAL_TASKS);
            const [referrals, setReferrals] = useState(() => storage.get("rh_referrals") || []);
            
            useEffect(() => {
                const stored = storage.get("rh_user");
                setUser(stored);
            }, []);
            
            const updateUser = useCallback((updates) => {
                if (!user) return;
                const updated = { ...user, ...updates };
                setUser(updated);
                storage.set("rh_user", updated);
                const allUsers = storage.get("rh_all_users") || [];
                storage.set("rh_all_users", allUsers.map(u => u.id === updated.id ? updated : u));
            }, [user]);
            
            const addCoins = useCallback((amount) => {
                if (!user) return;
                updateUser({ coins_balance: user.coins_balance + amount });
            }, [user, updateUser]);
            
            const addBalance = useCallback((amount) => {
                if (!user) return;
                updateUser({ 
                    available_balance: user.available_balance + amount,
                    total_earned: user.total_earned + amount
                });
            }, [user, updateUser]);
            
            const deductCoins = useCallback((amount) => {
                if (!user || user.coins_balance < amount) return false;
                updateUser({ coins_balance: user.coins_balance - amount });
                return true;
            }, [user, updateUser]);
            
            const completeTask = useCallback(async (task) => {
                if (!user) return false;
                
                const completions = storage.get(`rh_completions_${user.id}`) || [];
                if (completions.includes(task.id)) return false;
                
                if (!deductCoins(task.coin_cost)) return false;
                addBalance(task.reward);
                
                storage.set(`rh_completions_${user.id}`, [...completions, task.id]);
                return true;
            }, [user, deductCoins, addBalance]);
            
            const purchasePackage = useCallback(async (pkg) => {
                if (!user) return false;
                addCoins(pkg.coins);
                updateUser({ has_purchased_package: true });
                
                // Give referral reward if user was referred
                if (user.referred_by) {
                    const allUsers = storage.get("rh_all_users") || [];
                    const referrer = allUsers.find(u => u.id === user.referred_by);
                    if (referrer) {
                        const updatedReferrer = {
                            ...referrer,
                            available_balance: referrer.available_balance + 50,
                            total_earned: referrer.total_earned + 50,
                            coins_balance: referrer.coins_balance + 15,
                        };
                        storage.set("rh_all_users", allUsers.map(u => u.id === referrer.id ? updatedReferrer : u));
                        
                        const updatedReferrals = referrals.map(r => 
                            r.referee_id === user.id ? { ...r, status: "verified", reward_earned: 50, coins_earned: 15 } : r
                        );
                        setReferrals(updatedReferrals);
                        storage.set("rh_referrals", updatedReferrals);
                    }
                }
                
                return true;
            }, [user, addCoins, updateUser, referrals]);
            
            return (
                <GlobalContext.Provider value={{
                    user, tasks, packages: PACKAGES, referrals,
                    updateUser, addCoins, addBalance, deductCoins, completeTask, purchasePackage
                }}>
                    {children}
                </GlobalContext.Provider>
            );
        };
        
        const useGlobal = () => useContext(GlobalContext);

        // Pages
        const LandingPage = ({ setPage }) => (
            <div className="rewardhub-app">
                <div className="landing-header">
                    <span className="logo">RewardHub</span>
                    <div style={{ display: "flex", gap: 12 }}>
                        <button className="btn btn-secondary" onClick={() => setPage("login")}>Sign In</button>
                        <button className="btn btn-primary" onClick={() => setPage("signup")}>Get Started</button>
                    </div>
                </div>
                
                <div className="hero">
                    <h1>Earn Rewards Through<br /><span className="gradient-text">Skills & Referrals</span></h1>
                    <p>Join our community and start earning rewards through skill-based tasks, referrals, and more.</p>
                    <div style={{ display: "flex", gap: 16, justifyContent: "center" }}>
                        <button className="btn btn-primary" onClick={() => setPage("signup")}>Start Earning Now →</button>
                        <button className="btn btn-secondary" onClick={() => setPage("login")}>Sign In</button>
                    </div>
                </div>
                
                <div className="features">
                    {[
                        { icon: "🎯", title: "Skill-Based Tasks", desc: "Complete writing, editing, and learning tasks" },
                        { icon: "👥", title: "Referral Rewards", desc: "Earn commissions when friends join" },
                        { icon: "💳", title: "Easy Payments", desc: "Secure deposits and withdrawals" },
                        { icon: "⚡", title: "Instant Earnings", desc: "Get paid immediately upon completion" },
                    ].map(f => (
                        <div key={f.title} className="feature-card">
                            <div className="feature-icon">{f.icon}</div>
                            <h3>{f.title}</h3>
                            <p>{f.desc}</p>
                        </div>
                    ))}
                </div>
            </div>
        );
        
        const LoginPage = ({ setPage }) => {
            const { login } = useAuth();
            const toast = useToast();
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                setLoading(true);
                try {
                    await login(email, password);
                    toast({ title: "Welcome back!", type: "success" });
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };
            
            return (
                <div className="auth-container">
                    <div className="auth-card">
                        <div className="auth-logo">💰</div>
                        <h2 className="auth-title">Welcome Back</h2>
                        <p className="auth-sub">Sign in to your account</p>
                        
                        {error && <div className="alert alert-error">⚠️ {error}</div>}
                        
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">Email</label>
                                <input className="form-input" type="email" value={email} onChange={e => setEmail(e.target.value)} required />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Password</label>
                                <input className="form-input" type="password" value={password} onChange={e => setPassword(e.target.value)} required />
                            </div>
                            <button className="btn btn-primary w-full" type="submit" disabled={loading}>
                                {loading ? "Signing in..." : "Sign In"}
                            </button>
                        </form>

                        <div style={{ padding: "12px 0", borderTop: "1px solid rgba(255,255,255,0.1)" }}>
                            <div style={{ fontSize: 11, color: "#6b6f7e", marginBottom: 4 }}>Member Since</div>
                            <div>{new Date(user.created_at).toLocaleDateString()}</div>
                        </div>
                    </div>
                    
                    {user.is_admin && (
                        <div className="action-card" onClick={() => setPage("admin")}>
                            <div className="action-icon">⚙️</div>
                            <div className="action-content">
                                <div className="action-title">Admin Panel</div>
                                <div className="action-desc">Manage users, tasks, and withdrawals</div>
                            </div>
                            <span>→</span>
                        </div>
                    )}
                    
                    <button className="btn btn-danger w-full" onClick={logout}>Sign Out</button>
                </div>
            );
        };
        
        const AdminPage = ({ setPage }) => {
            const { user, tasks } = useGlobal();
            const [allUsers, setAllUsers] = useState([]);
            const [withdrawals, setWithdrawals] = useState([]);
            
            useEffect(() => {
                setAllUsers(storage.get("rh_all_users") || []);
                const allWithdrawals = [];
                const users = storage.get("rh_all_users") || [];
                users.forEach(u => {
                    const w = storage.get(`rh_withdrawals_${u.id}`) || [];
                    w.forEach(wd => allWithdrawals.push({ ...wd, username: u.username }));
                });
                setWithdrawals(allWithdrawals);
            }, []);
            
            if (!user?.is_admin) {
                setPage("dashboard");
                return null;
            }
            
            return (
                <div className="dashboard-container">
                    <button className="btn btn-secondary btn-sm" style={{ marginBottom: 20 }} onClick={() => setPage("account")}>← Back</button>
                    
                    <div className="welcome-section">
                        <h1>Admin Panel</h1>
                        <p style={{ color: "#6b6f7e" }}>Platform management</p>
                    </div>
                    
                    <div className="stats-grid">
                        <div className="stat-box">
                            <div className="stat-label">Total Users</div>
                            <div className="stat-value">{allUsers.length}</div>
                        </div>
                        <div className="stat-box">
                            <div className="stat-label">Pending Withdrawals</div>
                            <div className="stat-value amber">{withdrawals.filter(w => w.status === "pending").length}</div>
                        </div>
                        <div className="stat-box">
                            <div className="stat-label">Active Tasks</div>
                            <div className="stat-value">{tasks.filter(t => t.is_active).length}</div>
                        </div>
                    </div>
                    
                    <div className="stat-box">
                        <div style={{ fontWeight: 600, marginBottom: 16 }}>Users</div>
                        <div style={{ overflowX: "auto" }}>
                            <table style={{ width: "100%", fontSize: 13 }}>
                                <thead>
                                    <tr style={{ borderBottom: "1px solid rgba(255,255,255,0.1)" }}>
                                        <th style={{ textAlign: "left", padding: "12px 0" }}>User</th>
                                        <th style={{ textAlign: "left", padding: "12px 0" }}>Balance</th>
                                        <th style={{ textAlign: "left", padding: "12px 0" }}>Coins</th>
                                        <th style={{ textAlign: "left", padding: "12px 0" }}>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {allUsers.map(u => (
                                        <tr key={u.id} style={{ borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                                            <td style={{ padding: "12px 0" }}>
                                                <div style={{ fontWeight: 600 }}>{u.username}</div>
                                                <div style={{ fontSize: 11, color: "#6b6f7e" }}>{u.email}</div>
                                            </td>
                                            <td style={{ padding: "12px 0" }}>{u.available_balance} KSH</td>
                                            <td style={{ padding: "12px 0" }}>{u.coins_balance}</td>
                                            <td style={{ padding: "12px 0" }}>
                                                <span style={{ color: u.is_banned ? "#ef4444" : "#10b981" }}>{u.is_banned ? "Banned" : "Active"}</span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };
        
        // Main App Component
        const App = () => {
            const { user, loading } = useAuth();
            const [page, setPage] = useState("landing");
            
            useEffect(() => {
                if (loading) return;
                if (user && (page === "landing" || page === "login" || page === "signup")) {
                    setPage("dashboard");
                } else if (!user && !["landing", "login", "signup"].includes(page)) {
                    setPage("landing");
                }
            }, [user, loading, page]);
            
            if (loading) return <div style={{ display: "flex", justifyContent: "center", alignItems: "center", height: "100vh" }}><div className="spinner"></div></div>;
            
            const renderPage = () => {
                switch(page) {
                    case "landing": return <LandingPage setPage={setPage} />;
                    case "login": return <LoginPage setPage={setPage} />;
                    case "signup": return <SignupPage setPage={setPage} />;
                    case "dashboard": return <DashboardPage setPage={setPage} />;
                    case "tasks": return <TasksPage />;
                    case "referrals": return <ReferralsPage />;
                    case "wallet": return <WalletPage />;
                    case "deposits": return <DepositsPage setPage={setPage} />;
                    case "account": return <AccountPage setPage={setPage} />;
                    case "admin": return <AdminPage setPage={setPage} />;
                    default: return <DashboardPage setPage={setPage} />;
                }
            };
            
            const showBottomNav = user && !["landing", "login", "signup", "admin"].includes(page);
            const navItems = [
                { id: "dashboard", label: "Home", icon: "🏠" },
                { id: "tasks", label: "Tasks", icon: "⚡" },
                { id: "referrals", label: "Refer", icon: "👥" },
                { id: "wallet", label: "Wallet", icon: "💳" },
                { id: "account", label: "Account", icon: "👤" },
            ];
            
            return (
                <div className="rewardhub-app">
                    {user && (
                        <div className="landing-header">
                            <span className="logo">RewardHub</span>
                            <div className="balance-widget" style={{ display: "flex", gap: 16, background: "rgba(0,0,0,0.3)", padding: "8px 16px", borderRadius: 20 }}>
                                <span>💰 {user.available_balance} KSH</span>
                                <span>⚡ {user.coins_balance}</span>
                            </div>
                        </div>
                    )}
                    
                    {renderPage()}
                    
                    {showBottomNav && (
                        <div className="bottom-nav">
                            {navItems.map(item => (
                                <button key={item.id} className={`nav-item ${page === item.id ? "active" : ""}`} onClick={() => setPage(item.id)}>
                                    <span className="nav-icon">{item.icon}</span>
                                    <span className="nav-label">{item.label}</span>
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };
        
        // Render the app
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(
            <AuthProvider>
                <GlobalProvider>
                    <ToastProvider>
                        <App />
                    </ToastProvider>
                </GlobalProvider>
            </AuthProvider>
        );
    </script>
</body>
    </html>
