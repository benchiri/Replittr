<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>RewardHub - Premium Earning Platform</title>
    <meta name="description" content="Complete tasks, earn rewards, and withdraw instantly with RewardHub" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050816;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0B1220;
        }
        ::-webkit-scrollbar-thumb {
            background: #22FF88;
            border-radius: 10px;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        /* Glow Effects */
        .glow-green {
            box-shadow: 0 0 20px rgba(34, 255, 136, 0.3);
        }
        .glow-cyan {
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }
        .glow-purple {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #0B1220 25%, #1a1f2e 50%, #0B1220 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 16px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useCallback } = React;

        // ========== STORAGE HELPERS ==========
        const storage = {
            get: (key) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : null;
                } catch { return null; }
            },
            set: (key, value) => localStorage.setItem(key, JSON.stringify(value)),
            remove: (key) => localStorage.removeItem(key),
        };

        const generateId = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        const generateReferralCode = (username) => `${username.slice(0, 4)}${Math.random().toString(36).slice(2, 8).toUpperCase()}`;

        // ========== DATA ==========
        const PACKAGES = [
            { id: "small", name: "Starter", ksh: 300, coins: 30, badge: null },
            { id: "medium", name: "Growth", ksh: 500, coins: 70, badge: "🔥 BEST VALUE" },
            { id: "premium", name: "Premium", ksh: 1000, coins: 150, badge: "🌟 POPULAR" },
        ];

        const TASKS = [
            { id: "t1", title: "Follow on TikTok", description: "Follow our official TikTok account", category: "social", reward: 50, coin_cost: 5, difficulty: "Easy", icon: "📱", is_active: true },
            { id: "t2", title: "Write a Review", description: "Write a 100-word review about your experience", category: "writing", reward: 150, coin_cost: 15, difficulty: "Medium", icon: "✍️", is_active: true },
            { id: "t3", title: "YouTube Watch", description: "Watch our latest video for 2 minutes", category: "social", reward: 40, coin_cost: 4, difficulty: "Easy", icon: "▶️", is_active: true },
            { id: "t4", title: "Vocabulary Builder", description: "Learn new words and use them in sentences", category: "learning", reward: 80, coin_cost: 8, difficulty: "Medium", icon: "📚", is_active: true },
            { id: "t5", title: "Listening Task", description: "Listen to audio and answer questions", category: "listening", reward: 60, coin_cost: 6, difficulty: "Easy", icon: "🎧", is_active: true },
            { id: "t6", title: "Share on Twitter", description: "Share our pinned post on Twitter", category: "social", reward: 45, coin_cost: 4, difficulty: "Easy", icon: "🐦", is_active: true },
            { id: "t7", title: "Instagram Story", description: "Share our Instagram story", category: "social", reward: 55, coin_cost: 5, difficulty: "Easy", icon: "📸", is_active: true },
            { id: "t8", title: "Blog Writing", description: "Write a 300-word blog post", category: "writing", reward: 200, coin_cost: 20, difficulty: "Hard", icon: "📝", is_active: true },
        ];

        // ========== AUTH CONTEXT ==========
        const AuthContext = createContext(null);
        
        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const stored = storage.get("rh_user");
                setUser(stored);
                setLoading(false);
            }, []);

            const signup = async (email, password, username, referralCode) => {
                const allUsers = storage.get("rh_all_users") || [];
                if (allUsers.find(u => u.email === email)) throw new Error("Email already registered");
                if (allUsers.find(u => u.username === username)) throw new Error("Username taken");
                
                let referrerId = null;
                if (referralCode) {
                    const referrer = allUsers.find(u => u.referral_code === referralCode);
                    if (!referrer) throw new Error("Invalid referral code");
                    referrerId = referrer.id;
                }
                
                const isFirst = allUsers.length === 0;
                const newUser = {
                    id: generateId(),
                    email, username, password,
                    referral_code: generateReferralCode(username),
                    referred_by: referrerId,
                    total_earned: 0,
                    available_balance: 0,
                    pending_balance: 0,
                    coins_balance: 0,
                    total_tasks_completed: 0,
                    total_referrals: 0,
                    is_admin: isFirst,
                    is_superadmin: isFirst,
                    has_purchased_package: false,
                    is_banned: false,
                    created_at: new Date().toISOString(),
                };
                
                storage.set("rh_all_users", [...allUsers, newUser]);
                
                if (referrerId) {
                    const newReferral = {
                        id: generateId(),
                        referrer_id: referrerId,
                        referee_id: newUser.id,
                        status: "pending",
                        reward_earned: 0,
                        coins_earned: 0,
                        created_at: new Date().toISOString(),
                    };
                    const referrals = storage.get("rh_referrals") || [];
                    storage.set("rh_referrals", [...referrals, newReferral]);
                }
                
                storage.set("rh_user", newUser);
                setUser(newUser);
            };
            
            const login = async (email, password) => {
                const allUsers = storage.get("rh_all_users") || [];
                const found = allUsers.find(u => u.email === email && u.password === password);
                if (!found) throw new Error("Invalid email or password");
                if (found.is_banned) throw new Error("Account is banned");
                storage.set("rh_user", found);
                setUser(found);
            };
            
            const logout = () => {
                storage.remove("rh_user");
                setUser(null);
            };
            
            return (
                <AuthContext.Provider value={{ user, loading, signup, login, logout }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        const useAuth = () => useContext(AuthContext);

        // ========== TOAST CONTEXT ==========
        const ToastContext = createContext(null);
        
        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            
            const addToast = useCallback((toast) => {
                const id = generateId();
                setToasts(prev => [...prev, { ...toast, id }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
            }, []);
            
            return (
                <ToastContext.Provider value={addToast}>
                    {children}
                    <div style={{ position: "fixed", top: 20, right: 20, zIndex: 1100, display: "flex", flexDirection: "column", gap: 10 }}>
                        {toasts.map(toast => (
                            <div key={toast.id} style={{
                                background: "#0B1220",
                                backdropFilter: "blur(10px)",
                                borderLeft: `3px solid ${toast.type === "success" ? "#22FF88" : toast.type === "error" ? "#FF4444" : "#00D9FF"}`,
                                borderRadius: 12,
                                padding: "12px 16px",
                                minWidth: 260,
                                animation: "slideUp 0.3s ease-out",
                            }}>
                                <div style={{ fontWeight: 600 }}>{toast.title}</div>
                                {toast.message && <div style={{ fontSize: 12, color: "#A0AEC0" }}>{toast.message}</div>}
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };
        
        const useToast = () => useContext(ToastContext);

        // ========== GLOBAL CONTEXT ==========
        const GlobalContext = createContext(null);
        
        const GlobalProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [tasks] = useState(TASKS);
            const [referrals, setReferrals] = useState(() => storage.get("rh_referrals") || []);
            
            useEffect(() => {
                const stored = storage.get("rh_user");
                setUser(stored);
            }, []);
            
            const updateUser = useCallback((updates) => {
                if (!user) return;
                const updated = { ...user, ...updates };
                setUser(updated);
                storage.set("rh_user", updated);
                const allUsers = storage.get("rh_all_users") || [];
                storage.set("rh_all_users", allUsers.map(u => u.id === updated.id ? updated : u));
            }, [user]);
            
            const addCoins = useCallback((amount) => {
                if (!user) return;
                updateUser({ coins_balance: user.coins_balance + amount });
            }, [user, updateUser]);
            
            const addBalance = useCallback((amount) => {
                if (!user) return;
                updateUser({ 
                    available_balance: user.available_balance + amount,
                    total_earned: user.total_earned + amount
                });
            }, [user, updateUser]);
            
            const deductCoins = useCallback((amount) => {
                if (!user || user.coins_balance < amount) return false;
                updateUser({ coins_balance: user.coins_balance - amount });
                return true;
            }, [user, updateUser]);
            
            const completeTask = useCallback(async (task) => {
                if (!user) return false;
                
                const completions = storage.get(`rh_completions_${user.id}`) || [];
                if (completions.includes(task.id)) return false;
                
                if (!deductCoins(task.coin_cost)) return false;
                addBalance(task.reward);
                
                storage.set(`rh_completions_${user.id}`, [...completions, task.id]);
                updateUser({ total_tasks_completed: user.total_tasks_completed + 1 });
                return true;
            }, [user, deductCoins, addBalance, updateUser]);
            
            const purchasePackage = useCallback(async (pkg) => {
                if (!user) return false;
                addCoins(pkg.coins);
                updateUser({ has_purchased_package: true });
                
                if (user.referred_by) {
                    const allUsers = storage.get("rh_all_users") || [];
                    const referrer = allUsers.find(u => u.id === user.referred_by);
                    if (referrer) {
                        const updatedReferrer = {
                            ...referrer,
                            available_balance: referrer.available_balance + 50,
                            total_earned: referrer.total_earned + 50,
                            coins_balance: referrer.coins_balance + 15,
                            total_referrals: referrer.total_referrals + 1,
                        };
                        storage.set("rh_all_users", allUsers.map(u => u.id === referrer.id ? updatedReferrer : u));
                        
                        const updatedReferrals = referrals.map(r => 
                            r.referee_id === user.id ? { ...r, status: "verified", reward_earned: 50, coins_earned: 15 } : r
                        );
                        setReferrals(updatedReferrals);
                        storage.set("rh_referrals", updatedReferrals);
                    }
                }
                return true;
            }, [user, addCoins, updateUser, referrals]);
            
            return (
                <GlobalContext.Provider value={{
                    user, tasks, packages: PACKAGES, referrals,
                    updateUser, addCoins, addBalance, deductCoins, completeTask, purchasePackage
                }}>
                    {children}
                </GlobalContext.Provider>
            );
        };
        
        const useGlobal = () => useContext(GlobalContext);

        // ========== COMPONENTS ==========
        
        // Premium Glass Card Component
        const GlassCard = ({ children, glow = false, onClick, style = {} }) => (
            <div onClick={onClick} style={{
                background: "#0B1220",
                border: "1px solid rgba(34, 255, 136, 0.1)",
                borderRadius: 24,
                padding: 24,
                transition: "all 0.3s cubic-bezier(0.4, 0, 0.2, 1)",
                cursor: onClick ? "pointer" : "default",
                position: "relative",
                overflow: "hidden",
                ...style,
            }} onMouseEnter={e => {
                e.currentTarget.style.transform = "translateY(-4px)";
                e.currentTarget.style.borderColor = "rgba(34, 255, 136, 0.3)";
                e.currentTarget.style.boxShadow = "0 8px 32px rgba(0,0,0,0.4)";
            }} onMouseLeave={e => {
                e.currentTarget.style.transform = "translateY(0)";
                e.currentTarget.style.borderColor = "rgba(34, 255, 136, 0.1)";
                e.currentTarget.style.boxShadow = "none";
            }}>
                {glow && <div style={{
                    position: "absolute",
                    top: -50,
                    right: -50,
                    width: 150,
                    height: 150,
                    background: "radial-gradient(circle, rgba(34,255,136,0.15), transparent)",
                    borderRadius: "50%",
                    pointerEvents: "none",
                }} />}
                {children}
            </div>
        );
        
        // Gradient Button Component
        const GradientButton = ({ children, onClick, variant = "primary", fullWidth = false, disabled = false, size = "md" }) => {
            const gradients = {
                primary: "linear-gradient(135deg, #22FF88 0%, #00D9FF 100%)",
                secondary: "linear-gradient(135deg, #1a1f2e 0%, #0B1220 100%)",
                danger: "linear-gradient(135deg, #FF4444 0%, #FF6B6B 100%)",
            };
            
            const sizes = {
                sm: { padding: "8px 20px", fontSize: 13 },
                md: { padding: "12px 28px", fontSize: 14 },
                lg: { padding: "16px 32px", fontSize: 16 },
            };
            
            return (
                <button onClick={onClick} disabled={disabled} style={{
                    background: gradients[variant],
                    border: variant === "secondary" ? "1px solid rgba(34,255,136,0.3)" : "none",
                    borderRadius: 40,
                    padding: sizes[size].padding,
                    fontSize: sizes[size].fontSize,
                    fontWeight: 600,
                    color: variant === "secondary" ? "#22FF88" : "#050816",
                    cursor: disabled ? "not-allowed" : "pointer",
                    opacity: disabled ? 0.5 : 1,
                    width: fullWidth ? "100%" : "auto",
                    transition: "all 0.2s",
                    fontFamily: "inherit",
                }} onMouseEnter={e => {
                    if (!disabled) {
                        e.currentTarget.style.transform = "translateY(-2px)";
                        e.currentTarget.style.boxShadow = "0 4px 20px rgba(34,255,136,0.4)";
                    }
                }} onMouseLeave={e => {
                    e.currentTarget.style.transform = "translateY(0)";
                    e.currentTarget.style.boxShadow = "none";
                }}>
                    {children}
                </button>
            );
        };
        
        // Stat Card Component
        const StatCard = ({ label, value, icon, color, trend }) => (
            <GlassCard style={{ padding: 20 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                    <div style={{ fontSize: 28 }}>{icon}</div>
                    {trend && <span style={{ fontSize: 12, color: trend > 0 ? "#22FF88" : "#FF4444" }}>{trend > 0 ? `+${trend}%` : `${trend}%`}</span>}
                </div>
                <div style={{ fontSize: 12, color: "#A0AEC0", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.5px" }}>{label}</div>
                <div style={{ fontSize: 32, fontWeight: 700, color: color, fontFamily: "monospace" }}>{value}</div>
            </GlassCard>
        );
        
        // Action Card Component
        const ActionCard = ({ title, desc, icon, onClick }) => (
            <GlassCard onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 16, padding: 20 }}>
                <div style={{
                    width: 56,
                    height: 56,
                    background: "linear-gradient(135deg, rgba(34,255,136,0.1), rgba(0,217,255,0.05))",
                    borderRadius: 18,
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    fontSize: 28,
                }}>{icon}</div>
                <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, marginBottom: 4 }}>{title}</div>
                    <div style={{ fontSize: 12, color: "#A0AEC0" }}>{desc}</div>
                </div>
                <div style={{ fontSize: 20, color: "#22FF88" }}>→</div>
            </GlassCard>
        );

        // ========== PAGES ==========
        
        // Landing Page
        const LandingPage = ({ setPage }) => (
            <div style={{ minHeight: "100vh", background: "#050816" }}>
                {/* Animated Background */}
                <div style={{
                    position: "fixed",
                    top: 0,
                    left: 0,
                    right: 0,
                    bottom: 0,
                    background: "radial-gradient(circle at 20% 50%, rgba(34,255,136,0.08), transparent 50%), radial-gradient(circle at 80% 80%, rgba(0,217,255,0.05), transparent 60%)",
                    pointerEvents: "none",
                }} />
                
                {/* Header */}
                <div style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    padding: "20px 24px",
                    position: "sticky",
                    top: 0,
                    background: "rgba(5,8,22,0.9)",
                    backdropFilter: "blur(20px)",
                    zIndex: 100,
                    borderBottom: "1px solid rgba(34,255,136,0.1)",
                }}>
                    <div style={{ fontSize: 28, fontWeight: 800, background: "linear-gradient(135deg, #22FF88, #00D9FF)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>RewardHub</div>
                    <div style={{ display: "flex", gap: 12 }}>
                        <GradientButton variant="secondary" size="sm" onClick={() => setPage("login")}>Sign In</GradientButton>
                        <GradientButton size="sm" onClick={() => setPage("signup")}>Get Started</GradientButton>
                    </div>
                </div>
                
                {/* Hero Section */}
                <div style={{ textAlign: "center", padding: "80px 24px", position: "relative" }}>
                    <div className="animate-float" style={{ fontSize: 64, marginBottom: 24 }}>💰</div>
                    <h1 style={{ fontSize: "clamp(40px, 8vw, 64px)", fontWeight: 800, marginBottom: 20, lineHeight: 1.2 }}>
                        Earn Rewards Through<br />
                        <span style={{ background: "linear-gradient(135deg, #22FF88, #00D9FF)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>Skills & Referrals</span>
                    </h1>
                    <p style={{ fontSize: "clamp(14px, 2.5vw, 18px)", color: "#A0AEC0", maxWidth: 500, margin: "0 auto 40px", lineHeight: 1.5 }}>
                        Join 10,000+ earners completing tasks and building their income stream
                    </p>
                    <div style={{ display: "flex", gap: 16, justifyContent: "center", flexWrap: "wrap" }}>
                        <GradientButton size="lg" onClick={() => setPage("signup")}>Start Earning Now →</GradientButton>
                        <GradientButton variant="secondary" size="lg" onClick={() => setPage("login")}>Sign In</GradientButton>
                    </div>
                </div>
                
                {/* Stats Banner */}
                <div style={{
                    display: "flex",
                    justifyContent: "space-around",
                    flexWrap: "wrap",
                    gap: 32,
                    padding: "40px 24px",
                    maxWidth: 900,
                    margin: "0 auto",
                    textAlign: "center",
                }}>
                    {[
                        { value: "10K+", label: "Active Users", icon: "👥" },
                        { value: "50K+", label: "Tasks Completed", icon: "✅" },
                        { value: "1M+", label: "Rewards Paid", icon: "💸" },
                    ].map(stat => (
                        <div key={stat.label} style={{ flex: 1 }}>
                            <div style={{ fontSize: 32, fontWeight: 700, background: "linear-gradient(135deg, #22FF88, #00D9FF)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>{stat.value}</div>
                            <div style={{ fontSize: 13, color: "#A0AEC0" }}>{stat.label}</div>
                        </div>
                    ))}
                </div>
                
                {/* Features Grid */}
                <div style={{
                    display: "grid",
                    gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))",
                    gap: 20,
                    padding: "40px 24px 80px",
                    maxWidth: 1000,
                    margin: "0 auto",
                }}>
                    {[
                        { icon: "🎯", title: "Skill-Based Tasks", desc: "Complete writing, editing, and learning tasks" },
                        { icon: "👥", title: "Referral Rewards", desc: "Earn commissions when friends join" },
                        { icon: "💳", title: "M-PESA Integration", desc: "Secure deposits and withdrawals" },
                        { icon: "⚡", title: "Instant Earnings", desc: "Get paid immediately upon completion" },
                    ].map(f => (
                        <GlassCard key={f.title} style={{ textAlign: "center", padding: 32 }}>
                            <div style={{ fontSize: 48, marginBottom: 16 }}>{f.icon}</div>
                            <div style={{ fontWeight: 700, fontSize: 18, marginBottom: 8 }}>{f.title}</div>
                            <div style={{ fontSize: 13, color: "#A0AEC0", lineHeight: 1.5 }}>{f.desc}</div>
                        </GlassCard>
                    ))}
                </div>
            </div>
        );
        
        // Login Page
        const LoginPage = ({ setPage }) => {
            const { login } = useAuth();
            const toast = useToast();
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                setLoading(true);
                try {
                    await login(email, password);
                    toast({ title: "Welcome back!", type: "success" });
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };
            
            return (
                <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, background: "#050816" }}>
                    <GlassCard style={{ maxWidth: 440, width: "100%", padding: 40 }}>
                        <div style={{ textAlign: "center", marginBottom: 32 }}>
                            <div style={{
                                width: 64,
                                height: 64,
                                background: "linear-gradient(135deg, #22FF88, #00D9FF)",
                                borderRadius: 20,
                                display: "flex",
                                alignItems: "center",
                                justifyContent: "center",
                                margin: "0 auto 20px",
                                fontSize: 32,
                            }}>💰</div>
                            <h2 style={{ fontSize: 32, fontWeight: 700, marginBottom: 8 }}>Welcome Back</h2>
                            <p style={{ fontSize: 14, color: "#A0AEC0" }}>Sign in to your account</p>
                        </div>
                        
                        {error && (
                            <div style={{
                                background: "rgba(255,68,68,0.1)",
                                border: "1px solid rgba(255,68,68,0.2)",
                                borderRadius: 12,
                                padding: 12,
                                marginBottom: 20,
                                fontSize: 13,
                                color: "#FF4444",
                            }}>⚠️ {error}</div>
                        )}
                        
                        <form onSubmit={handleSubmit}>
                            <div style={{ marginBottom: 20 }}>
                                <label style={{ fontSize: 12, color: "#A0AEC0", marginBottom: 8, display: "block" }}>EMAIL</label>
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} required style={{
                                    width: "100%",
                                    padding: "14px 16px",
                                    background: "rgba(255,255,255,0.05)",

                } : u);
                storage.set("rh_all_users", updatedUsers);
                storage.set("rh_user", updatedUsers.find(u => u.id === user.id));
                
                toast({ title: "Withdrawal requested!", message: "Pending admin approval", type: "success" });
                setAmount("");
                setTimeout(() => window.location.reload(), 1000);
            };
            
            return (
                <div style={{ padding: "20px 20px 100px", maxWidth: 900, margin: "0 auto" }}>
                    <div style={{ marginBottom: 24 }}>
                        <h1 style={{ fontSize: 28, fontWeight: 800, marginBottom: 8 }}>Wallet</h1>
                        <p style={{ fontSize: 14, color: "#A0AEC0" }}>Manage your earnings and withdrawals</p>
                    </div>
                    
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16, marginBottom: 24 }}>
                        <StatCard label="Available" value={`${user.available_balance.toLocaleString()} KSH`} icon="💰" color="#22FF88" />
                        <StatCard label="Pending" value={`${user.pending_balance.toLocaleString()} KSH`} icon="⏳" color="#00D9FF" />
                        <StatCard label="Coins" value={user.coins_balance} icon="⚡" color="#8B5CF6" />
                        <StatCard label="Total Earned" value={`${user.total_earned.toLocaleString()} KSH`} icon="🏆" color="#F59E0B" />
                    </div>
                    
                    {user.available_balance >= 1500 ? (
                        <GlassCard>
                            <div style={{ fontWeight: 600, marginBottom: 16 }}>Request Withdrawal</div>
                            <div style={{ marginBottom: 16 }}>
                                <label style={{ fontSize: 12, color: "#A0AEC0", marginBottom: 8, display: "block" }}>AMOUNT (KSH)</label>
                                <input type="number" placeholder="1500" min="1500" value={amount} onChange={e => setAmount(e.target.value)} style={{
                                    width: "100%",
                                    padding: "14px 16px",
                                    background: "rgba(255,255,255,0.05)",
                                    border: "1px solid rgba(34,255,136,0.2)",
                                    borderRadius: 12,
                                    color: "white",
                                    fontSize: 14,
                                    outline: "none",
                                }} />
                            </div>
                            <GradientButton fullWidth onClick={requestWithdrawal}>Request Withdrawal</GradientButton>
                        </GlassCard>
                    ) : (
                        <GlassCard style={{ background: "rgba(245,158,11,0.1)", borderColor: "#F59E0B" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                                <span style={{ fontSize: 32 }}>🔒</span>
                                <div>
                                    <div style={{ fontWeight: 600, marginBottom: 4 }}>Minimum Withdrawal: 1,500 KSH</div>
                                    <div style={{ fontSize: 12, color: "#A0AEC0" }}>Need {(1500 - user.available_balance).toLocaleString()} KSH more</div>
                                </div>
                            </div>
                        </GlassCard>
                    )}
                    
                    {withdrawals.length > 0 && (
                        <GlassCard style={{ marginTop: 24 }}>
                            <div style={{ fontWeight: 600, marginBottom: 16 }}>Withdrawal History</div>
                            <div style={{ overflowX: "auto" }}>
                                <table style={{ width: "100%", fontSize: 13 }}>
                                    <thead>
                                        <tr style={{ borderBottom: "1px solid rgba(255,255,255,0.1)" }}>
                                            <th style={{ textAlign: "left", padding: "12px 0" }}>Amount</th>
                                            <th style={{ textAlign: "left", padding: "12px 0" }}>Status</th>
                                            <th style={{ textAlign: "right", padding: "12px 0" }}>Date</th>
                                        </td>
                                    </thead>
                                    <tbody>
                                        {withdrawals.map(w => (
                                            <tr key={w.id} style={{ borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                                                <td style={{ padding: "12px 0", fontWeight: 600 }}>{w.amount.toLocaleString()} KSH</td>
                                                <td style={{ padding: "12px 0" }}>
                                                    <span style={{ color: w.status === "completed" ? "#22FF88" : w.status === "pending" ? "#F59E0B" : "#FF4444" }}>{w.status}</span>
                                                </td>
                                                <td style={{ padding: "12px 0", textAlign: "right", color: "#A0AEC0" }}>{new Date(w.created_at).toLocaleDateString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </GlassCard>
                    )}
                </div>
            );
        };
        
        // Deposits Page
        const DepositsPage = ({ setPage }) => {
            const { user, packages, purchasePackage } = useGlobal();
            const toast = useToast();
            const [loading, setLoading] = useState(null);
            
            if (!user) return null;
            
            const handlePurchase = async (pkg) => {
                setLoading(pkg.id);
                await new Promise(r => setTimeout(r, 1000));
                await purchasePackage(pkg);
                setLoading(null);
                toast({ title: "Purchase successful!", message: `${pkg.coins} coins added`, type: "success" });
            };
            
            return (
                <div style={{ padding: "20px 20px 100px", maxWidth: 900, margin: "0 auto" }}>
                    <button onClick={() => setPage("dashboard")} style={{
                        background: "none",
                        border: "none",
                        color: "#A0AEC0",
                        fontSize: 14,
                        cursor: "pointer",
                        marginBottom: 20,
                        display: "flex",
                        alignItems: "center",
                        gap: 8,
                    }}>← Back</button>
                    
                    <div style={{ marginBottom: 24 }}>
                        <h1 style={{ fontSize: 28, fontWeight: 800, marginBottom: 8 }}>Buy Coins</h1>
                        <p style={{ fontSize: 14, color: "#A0AEC0" }}>Purchase packages to get coins and unlock tasks</p>
                    </div>
                    
                    <GlassCard style={{ marginBottom: 24 }}>
                        <div style={{ display: "flex", justifyContent: "space-between" }}>
                            <div>
                                <div style={{ fontSize: 13, color: "#A0AEC0" }}>Current Balance</div>
                                <div style={{ fontSize: 32, fontWeight: 700, color: "#00D9FF" }}>{user.coins_balance} coins</div>
                            </div>
                            <div>
                                <div style={{ fontSize: 13, color: "#A0AEC0" }}>Available KSH</div>
                                <div style={{ fontSize: 32, fontWeight: 700, color: "#22FF88" }}>{user.available_balance.toLocaleString()} KSH</div>
                            </div>
                        </div>
                    </GlassCard>
                    
                    {packages.map(pkg => (
                        <GlassCard key={pkg.id} style={{ marginBottom: 16, position: "relative", borderColor: pkg.popular ? "#22FF88" : "rgba(34,255,136,0.1)" }}>
                            {pkg.badge && (
                                <div style={{
                                    position: "absolute",
                                    top: 16,
                                    right: 16,
                                    background: "linear-gradient(135deg, #22FF88, #00D9FF)",
                                    color: "#050816",
                                    padding: "4px 12px",
                                    borderRadius: 20,
                                    fontSize: 11,
                                    fontWeight: 700,
                                }}>{pkg.badge}</div>
                            )}
                            <div style={{ fontSize: 24, fontWeight: 700, marginBottom: 8 }}>{pkg.name}</div>
                            <div style={{ fontSize: 36, fontWeight: 800, color: "#00D9FF", marginBottom: 16 }}>{pkg.ksh.toLocaleString()} KSH</div>
                            <div style={{
                                background: "rgba(34,255,136,0.05)",
                                padding: "12px",
                                borderRadius: 12,
                                textAlign: "center",
                                marginBottom: 16,
                            }}>
                                <span style={{ fontSize: 24 }}>⚡</span>
                                <span style={{ fontSize: 24, fontWeight: 700, marginLeft: 8 }}>{pkg.coins} coins</span>
                            </div>
                            <GradientButton fullWidth disabled={loading !== null} onClick={() => handlePurchase(pkg)}>
                                {loading === pkg.id ? "Processing..." : `Pay ${pkg.ksh} KSH →`}
                            </GradientButton>
                        </GlassCard>
                    ))}
                </div>
            );
        };
        
        // Account Page
        const AccountPage = ({ setPage }) => {
            const { user } = useGlobal();
            const { logout } = useAuth();
            const completions = storage.get(`rh_completions_${user?.id}`) || [];
            
            if (!user) return null;
            
            return (
                <div style={{ padding: "20px 20px 100px", maxWidth: 900, margin: "0 auto" }}>
                    <div style={{ textAlign: "center", marginBottom: 32 }}>
                        <div style={{
                            width: 88,
                            height: 88,
                            background: "linear-gradient(135deg, #22FF88, #00D9FF)",
                            borderRadius: 44,
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "center",
                            margin: "0 auto 20px",
                            fontSize: 40,
                            fontWeight: 700,
                        }}>{user.username[0].toUpperCase()}</div>
                        <h1 style={{ fontSize: 24, fontWeight: 700, marginBottom: 8 }}>{user.username}</h1>
                        <p style={{ fontSize: 13, color: "#A0AEC0" }}>{user.email}</p>
                        {user.is_admin && <span style={{ display: "inline-block", marginTop: 8, padding: "4px 16px", background: "rgba(139,92,246,0.2)", borderRadius: 20, fontSize: 12, color: "#8B5CF6" }}>Admin</span>}
                    </div>
                    
                    <GlassCard style={{ marginBottom: 20 }}>
                        <div style={{ fontWeight: 600, marginBottom: 16 }}>Account Stats</div>
                        <div style={{ display: "flex", justifyContent: "space-between", padding: "12px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                            <span style={{ color: "#A0AEC0" }}>Tasks Completed</span>
                            <span style={{ fontWeight: 600, color: "#22FF88" }}>{completions.length}</span>
                        </div>
                        <div style={{ display: "flex", justifyContent: "space-between", padding: "12px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                            <span style={{ color: "#A0AEC0" }}>Member Since</span>
                            <span style={{ fontWeight: 600 }}>{new Date(user.created_at).toLocaleDateString()}</span>
                        </div>
                        <div style={{ display: "flex", justifyContent: "space-between", padding: "12px 0" }}>
                            <span style={{ color: "#A0AEC0" }}>Account Status</span>
                            <span style={{ fontWeight: 600, color: user.has_purchased_package ? "#22FF88" : "#F59E0B" }}>{user.has_purchased_package ? "Active" : "Package Required"}</span>
                        </div>
                    </GlassCard>
                    
                    <GlassCard style={{ marginBottom: 20 }}>
                        <div style={{ fontWeight: 600, marginBottom: 16 }}>Account Details</div>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0" }}>
                            <div>
                                <div style={{ fontSize: 12, color: "#A0AEC0", marginBottom: 4 }}>Referral Code</div>
                                <code style={{ fontWeight: 600 }}>{user.referral_code}</code>
                            </div>
                            <GradientButton size="sm" onClick={() => {
                                navigator.clipboard.writeText(user.referral_code);
                            }}>Copy</GradientButton>
                        </div>
                    </GlassCard>
                    
                    {user.is_admin && (
                        <GlassCard style={{ marginBottom: 20, cursor: "pointer" }} onClick={() => setPage("admin")}>
                            <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                                <span style={{ fontSize: 28 }}>⚙️</span>
                                <div style={{ flex: 1 }}>
                                    <div style={{ fontWeight: 700 }}>Admin Panel</div>
                                    <div style={{ fontSize: 12, color: "#A0AEC0" }}>Manage users, tasks, and withdrawals</div>
                                </div>
                                <span style={{ fontSize: 20, color: "#22FF88" }}>→</span>
                            </div>
                        </GlassCard>
                    )}
                    
                    <GradientButton variant="danger" fullWidth onClick={logout}>Sign Out</GradientButton>
                </div>
            );
        };
        
        // Admin Page (Simplified)
        const AdminPage = ({ setPage }) => {
            const { user } = useGlobal();
            const [allUsers, setAllUsers] = useState([]);
            
            useEffect(() => {
                setAllUsers(storage.get("rh_all_users") || []);
            }, []);
            
            if (!user?.is_admin) {
                setPage("dashboard");
                return null;
            }
            
            const toggleBan = (userId) => {
                const updated = allUsers.map(u => u.id === userId ? { ...u, is_banned: !u.is_banned } : u);
                setAllUsers(updated);
                storage.set("rh_all_users", updated);
            };
            
            return (
                <div style={{ padding: "20px 20px 100px", maxWidth: 900, margin: "0 auto" }}>
                    <button onClick={() => setPage("account")} style={{
                        background: "none",
                        border: "none",
                        color: "#A0AEC0",
                        fontSize: 14,
                        cursor: "pointer",
                        marginBottom: 20,
                    }}>← Back</button>
                    
                    <div style={{ marginBottom: 24 }}>
                        <h1 style={{ fontSize: 28, fontWeight: 800, marginBottom: 8 }}>Admin Panel</h1>
                        <p style={{ fontSize: 14, color: "#A0AEC0" }}>Platform Management</p>
                    </div>
                    
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16, marginBottom: 24 }}>
                        <StatCard label="Total Users" value={allUsers.length} icon="👥" color="#22FF88" />
                        <StatCard label="Total Revenue" value={`${allUsers.reduce((sum, u) => sum + u.total_earned, 0).toLocaleString()} KSH`} icon="💰" color="#00D9FF" />
                    </div>
                    
                    <GlassCard>
                        <div style={{ fontWeight: 600, marginBottom: 16 }}>Users</div>
                        <div style={{ overflowX: "auto" }}>
                            <table style={{ width: "100%", fontSize: 13 }}>
                                <thead>
                                    <tr style={{ borderBottom: "1px solid rgba(255,255,255,0.1)" }}>
                                        <th style={{ textAlign: "left", padding: "12px 0" }}>User</th>
                                        <th style={{ textAlign: "left", padding: "12px 0" }}>Balance</th>
                                        <th style={{ textAlign: "left", padding: "12px 0" }}>Status</th>
                                        <th style={{ textAlign: "right", padding: "12px 0" }}>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {allUsers.map(u => (
                                        <tr key={u.id} style={{ borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                                            <td style={{ padding: "12px 0" }}>
                                                <div style={{ fontWeight: 600 }}>{u.username}</div>
                                                <div style={{ fontSize: 11, color: "#A0AEC0" }}>{u.email}</div>
                                            </td>
                                            <td style={{ padding: "12px 0" }}>{u.available_balance} KSH</td>
                                            <td style={{ padding: "12px 0" }}>
                                                <span style={{ color: u.is_banned ? "#FF4444" : "#22FF88" }}>{u.is_banned ? "Banned" : "Active"}</span>
                                            </td>
                                            <td style={{ padding: "12px 0", textAlign: "right" }}>
                                                <GradientButton size="sm" variant={u.is_banned ? "primary" : "secondary"} onClick={() => toggleBan(u.id)}>
                                                    {u.is_banned ? "Unban" : "Ban"}
                                                </GradientButton>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </GlassCard>
                </div>
            );
        };
        
        // Main App Component
        const App = () => {
            const { user, loading } = useAuth();
            const [page, setPage] = useState("landing");
            
            useEffect(() => {
                if (loading) return;
                if (user && (page === "landing" || page === "login" || page === "signup")) {
                    setPage("dashboard");
                } else if (!user && !["landing", "login", "signup"].includes(page)) {
                    setPage("landing");
                }
            }, [user, loading, page]);
            
            if (loading) {
                return (
                    <div style={{ display: "flex", justifyContent: "center", alignItems: "center", height: "100vh", background: "#050816" }}>
                        <div className="skeleton" style={{ width: 40, height: 40, borderRadius: "50%" }} />
                    </div>
                );
            }
            
            const renderPage = () => {
                switch(page) {
                    case "landing": return <LandingPage setPage={setPage} />;
                    case "login": return <LoginPage setPage={setPage} />;
                    case "signup": return <SignupPage setPage={setPage} />;
                    case "dashboard": return <DashboardPage setPage={setPage} />;
                    case "tasks": return <TasksPage />;
                    case "referrals": return <ReferralsPage />;
                    case "wallet": return <WalletPage />;
                    case "deposits": return <DepositsPage setPage={setPage} />;
                    case "account": return <AccountPage setPage={setPage} />;
                    case "admin": return <AdminPage setPage={setPage} />;
                    default: return <DashboardPage setPage={setPage} />;
                }
            };
            
            const showBottomNav = user && !["landing", "login", "signup", "admin"].includes(page);
            const navItems = [
                { id: "dashboard", label: "Home", icon: "🏠" },
                { id: "tasks", label: "Tasks", icon: "🎯" },
                { id: "referrals", label: "Refer", icon: "👥" },
                { id: "wallet", label: "Wallet", icon: "💳" },
                { id: "account", label: "Account", icon: "👤" },
            ];
            
            return (
                <div style={{ background: "#050816", minHeight: "100vh" }}>
                    {/* Top Navbar */}
                    {user && (
                        <div style={{
                            position: "sticky",
                            top: 0,
                            zIndex: 100,
                            background: "rgba(5,8,22,0.95)",
                            backdropFilter: "blur(20px)",
                            borderBottom: "1px solid rgba(34,255,136,0.1)",
                            padding: "12px 20px",
                            display: "flex",
                            justifyContent: "space-between",
                            alignItems: "center",
                        }}>
                            <div style={{ fontSize: 22, fontWeight: 800, background: "linear-gradient(135deg, #22FF88, #00D9FF)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>RewardHub</div>
                            <div style={{ display: "flex", gap: 12 }}>
                                <div style={{
                                    background: "rgba(34,255,136,0.1)",
                                    borderRadius: 40,
                                    padding: "6px 16px",
                                    display: "flex",
                                    alignItems: "center",
                                    gap: 8,
                                }}>
                                    <span style={{ fontSize: 14 }}>⚡</span>
                                    <span style={{ fontWeight: 700, color: "#00D9FF" }}>{user.coins_balance}</span>
                                </div>
                                <div style={{
                                    background: "rgba(0,217,255,0.1)",
                                    borderRadius: 40,
                                    padding: "6px 16px",
                                    display: "flex",
                                    alignItems: "center",
                                    gap: 8,
                                }}>
                                    <span style={{ fontSize: 14 }}>💰</span>
                                    <span style={{ fontWeight: 700, color: "#22FF88" }}>{user.available_balance.toLocaleString()} KSH</span>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {renderPage()}
                    
                    {/* Bottom Navigation */}
                    {showBottomNav && (
                        <div style={{
                            position: "fixed",
                            bottom: 0,
                            left: 0,
                            right: 0,
                            background: "rgba(11,18,32,0.95)",
                            backdropFilter: "blur(20px)",
                            borderTop: "1px solid rgba(34,255,136,0.1)",
                            display: "flex",
                            padding: "8px 16px 20px",
                            gap: 4,
                            zIndex: 100,
                        }}>
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setPage(item.id)} style={{
                                    flex: 1,
                                    display: "flex",
                                    flexDirection: "column",
                                    alignItems: "center",
                                    gap: 4,
                                    padding: "8px 4px",
                                    background: "none",
                                    border: "none",
                                    cursor: "pointer",
                                    borderRadius: 12,
                                    transition: "all 0.2s",
                                    color: page === item.id ? "#22FF88" : "#A0AEC0",
                                }}>
                                    <span style={{ fontSize: 22 }}>{item.icon}</span>
                                    <span style={{ fontSize: 10, fontWeight: 600 }}>{item.label}</span>
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };
        
        // Render
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(
            <AuthProvider>
                <GlobalProvider>
                    <ToastProvider>
                        <App />
                    </ToastProvider>
                </GlobalProvider>
            </AuthProvider>
        );
    </script>
</body>
    </html>
